<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Matchreferat live</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #111418;
      --muted: #6b7078;
      --line: #e3e4e8;
      --slab: #171c24;
      --slab-text: #ffffff;
      --slab-muted: rgba(255, 255, 255, 0.72);
      --clock: #ffd633;
      --us: #218c4a;
      --them: #bd572b;
      --live: #e5372b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f2f2f7;
        --muted: #9a9ca3;
        --line: #2c2c2f;
        --slab: #1c222c;
        --us: #39b36a;
        --them: #e07a4c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 2px 12px;
      font-size: 14px;
      color: var(--muted);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--live);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.06em;
    }
    .badge.off { background: var(--muted); }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.6s infinite; }
    .badge.off .dot { animation: none; }
    @keyframes pulse { 50% { opacity: 0.25; } }
    .slab {
      background: var(--slab);
      color: var(--slab-text);
      border-radius: 22px;
      padding: 20px 14px 16px;
      text-align: center;
    }
    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }
    .team { display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; font-size: 17px; line-height: 1.2; overflow-wrap: anywhere; }
    .team .dot { width: 10px; height: 10px; border-radius: 50%; }
    .team .role { font-size: 12px; font-weight: 500; color: var(--slab-muted); }
    .score {
      font: 900 60px/1 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .clockline { margin-top: 12px; display: flex; justify-content: center; align-items: baseline; gap: 10px; }
    .clock {
      font: 900 30px/1 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif;
      font-variant-numeric: tabular-nums;
      color: var(--clock);
    }
    .period { color: var(--slab-muted); font-weight: 500; font-size: 15px; }
    .stats { margin-top: 10px; color: var(--slab-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 24px 4px 8px; }
    .timeline { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 16px; overflow: hidden; }
    .timeline li { display: grid; grid-template-columns: 52px 28px 1fr; gap: 6px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: baseline; }
    .timeline li:first-child { border-top: 0; }
    .minute { font-weight: 600; font-variant-numeric: tabular-nums; }
    .icon { text-align: center; }
    .text.type-goal { font-weight: 700; }
    .team-name { display: block; font-size: 12px; color: var(--muted); }
    .side-us .team-name { color: var(--us); }
    .side-them .team-name { color: var(--them); }
    .empty, .message { padding: 18px; color: var(--muted); text-align: center; }
    .message { background: var(--card); border-radius: 16px; margin-top: 16px; }
    footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="topline">
      <span id="brand">Matchreferat</span>
      <span id="badge" class="badge off"><span class="dot"></span><span id="badge-text">ANSLUTER</span></span>
    </div>

    <section id="match" hidden>
      <div class="slab">
        <div class="teams">
          <div class="team"><span class="dot" id="home-dot"></span><span id="home-name"></span><span class="role">Hemma</span></div>
          <div class="score" id="score"></div>
          <div class="team"><span class="dot" id="away-dot"></span><span id="away-name"></span><span class="role">Borta</span></div>
        </div>
        <div class="clockline"><span class="clock" id="clock"></span><span class="period" id="period"></span></div>
        <div class="stats" id="stats"></div>
      </div>

      <h2>Händelser</h2>
      <ul class="timeline" id="timeline"></ul>
    </section>

    <div class="message" id="message" hidden></div>

    <footer>
      <div id="updated"></div>
      <div>Sidan uppdateras automatiskt. Spelare visas bara med förnamn och tröjnummer.</div>
    </footer>
  </main>

  <script type="module">
    const FIREBASE = "https://www.gstatic.com/firebasejs/13.1.0";
    const ICONS = { goal: "⚽", shot: "🎯", corner: "🚩", freeKick: "🦶", yellow: "🟨", red: "🟥", sub: "🔁", save: "🧤", period: "⏱",
                    penalty: "❌", suspension: "⛔" };
    // Floorball (innebandy) from 1.0.3 has its own goal and free-hit icons.
    const FLOORBALL_ICONS = { ...ICONS, goal: "🥅", freeKick: "🏑" };
    const SPORTS = { football: "Fotboll", floorball: "Innebandy" };
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const matchId = params.get("m") || (location.pathname.match(/^\/m\/([A-Za-z0-9]{22,64})\/?$/) || [])[1];
    const isLocal = ["127.0.0.1", "localhost"].includes(location.hostname);
    let current = null;

    const millis = (t) => (t == null ? null : typeof t.toMillis === "function" ? t.toMillis() : Number(t));

    function liveMinute(d, now) {
      const len = d.halfLength;
      const periods = d.periods || 2;
      const period = d.period || 1;
      if (d.phase === "notStarted") return "0'";
      if (d.phase === "interval") return `${period * len}'`;
      if (d.phase === "finished") return `${periods * len}'`;
      let elapsed = d.accumulated || 0;
      const started = millis(d.startedAt);
      if (d.running && started) elapsed += Math.max(0, (now - started) / 1000);
      const base = (period - 1) * len;
      const full = base + Math.floor(elapsed / 60) + 1;
      const limit = base + len;
      return full > limit ? `${limit}+${full - limit}'` : `${full}'`;
    }

    // `sport` is missing for football and on servers whose rules predate 1.0.3; floorball then
    // still shows in the texts, which say "period" instead of "halvlek".
    function sportOf(d) {
      if (SPORTS[d.sport]) return d.sport;
      const floorball = /period/i.test(d.periodText || "") || (d.events || []).some((e) => e.type === "suspension");
      return floorball ? "floorball" : "football";
    }

    function showMessage(text) {
      $("match").hidden = true;
      $("message").hidden = false;
      $("message").textContent = text;
      setBadge(false, "EJ LIVE");
    }

    function setBadge(live, text) {
      $("badge").classList.toggle("off", !live);
      $("badge-text").textContent = text;
    }

    function render(d) {
      if (millis(d.expireAt) && millis(d.expireAt) < Date.now()) {
        showMessage("Länken har gått ut.");
        return;
      }
      current = d;
      $("message").hidden = true;
      $("match").hidden = false;

      const homeSide = d.isHome ? "us" : "them";
      const awaySide = d.isHome ? "them" : "us";
      $("home-name").textContent = d.homeName;
      $("away-name").textContent = d.awayName;
      $("home-dot").style.background = `var(--${homeSide})`;
      $("away-dot").style.background = `var(--${awaySide})`;
      $("score").textContent = `${d.homeScore}–${d.awayScore}`;
      $("period").textContent = d.periodText;
      $("stats").textContent = d.stats;
      const sport = sportOf(d);
      const icons = sport === "floorball" ? FLOORBALL_ICONS : ICONS;
      $("brand").textContent = `Matchreferat · ${SPORTS[sport]}`;
      document.title = `${d.homeName} – ${d.awayName} ${d.homeScore}–${d.awayScore} · ${SPORTS[sport]} · Matchreferat`;

      const live = d.phase === "playing";
      const pause = sport === "floorball" ? "PERIODPAUS" : (d.periods || 2) === 2 ? "HALVTID" : "PAUS";
      setBadge(live, live ? "LIVE" : d.phase === "finished" ? "SLUT" : d.phase === "interval" ? pause : "EJ STARTAD");

      const list = $("timeline");
      list.replaceChildren();
      const events = [...(d.events || [])].reverse();
      if (events.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "Inga händelser än";
        list.append(li);
      }
      for (const e of events) {
        const li = document.createElement("li");
        li.className = `side-${e.type === "period" ? "match" : e.side}`;
        const minute = document.createElement("span");
        minute.className = "minute";
        minute.textContent = e.m;
        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = icons[e.type] || "•";
        const text = document.createElement("span");
        text.className = `text type-${e.type}`;
        text.textContent = e.text;
        const team = document.createElement("span");
        team.className = "team-name";
        team.textContent = e.team;
        text.append(team);
        li.append(minute, icon, text);
        list.append(li);
      }

      const updated = millis(d.updatedAt);
      $("updated").textContent = updated
        ? `Senast uppdaterad ${new Date(updated).toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`
        : "";
      tick();
    }

    function tick() {
      if (current) $("clock").textContent = liveMinute(current, Date.now());
    }
    setInterval(tick, 1000);

    function demoMatch() {
      const now = Date.now();
      const ev = (m, type, side, text, team) => ({ m, type, side, text, team });
      if (params.get("demo") === "innebandy") {
        return {
          sport: "floorball", homeName: "Ditt lag", awayName: "Ekbacka IBK", isHome: true, homeScore: 2, awayScore: 1,
          phase: "playing", period: 2, periods: 3, running: true, startedAt: now - 560000, accumulated: 0, halfLength: 15,
          periodText: "2:a period", stats: "Skott 3–3 · På mål 3–2 · Utvisningar 2",
          updatedAt: now - 20000, expireAt: now + 7 * 864e5,
          events: [
            ev("1'", "period", "us", "Avspark", "Match"),
            ev("3'", "shot", "us", "Skott på mål, räddning – Saga (10)", "Ditt lag"),
            ev("5'", "goal", "us", "Mål! Ebba (7), assist Saga (10)", "Ditt lag"),
            ev("8'", "shot", "them", "Skott utanför", "Ekbacka IBK"),
            ev("9'", "suspension", "us", "Utvisning 2 min – Lova (5)", "Ditt lag"),
            ev("10'", "goal", "them", "Mål Ekbacka IBK", "Ekbacka IBK"),
            ev("13'", "freeKick", "us", "Frislag", "Ditt lag"),
            ev("15'", "period", "us", "Periodpaus 1–1", "Match"),
            ev("16'", "period", "us", "2:a period startar", "Match"),
            ev("17'", "sub", "us", "Byte: Moa (12) ut, Vera (14) in", "Ditt lag"),
            ev("19'", "goal", "us", "Straffmål! Saga (10)", "Ditt lag"),
            ev("21'", "shot", "them", "Skott på mål, räddning", "Ekbacka IBK"),
            ev("22'", "freeKick", "them", "Frislag", "Ekbacka IBK"),
            ev("24'", "suspension", "us", "Utvisning 2 min – Agnes (3)", "Ditt lag"),
          ],
        };
      }
      return {
        homeName: "Ditt lag", awayName: "Ekbacka IK", isHome: true, homeScore: 2, awayScore: 1,
        phase: "playing", period: 2, periods: 2, running: true, startedAt: now - 500000, accumulated: 0, halfLength: 25,
        periodText: "2:a halvlek", stats: "Skott 3–3 · På mål 3–2 · Hörnor 2–1",
        updatedAt: now - 20000, expireAt: now + 7 * 864e5,
        events: [
          ev("1'", "period", "us", "Avspark", "Match"),
          ev("4'", "shot", "us", "Skott på mål, räddning – Elias (9)", "Ditt lag"),
          ev("6'", "corner", "us", "Hörna", "Ditt lag"),
          ev("9'", "goal", "us", "Mål! Selma (10), assist Wilma (8)", "Ditt lag"),
          ev("13'", "shot", "them", "Skott utanför", "Ekbacka IK"),
          ev("15'", "corner", "them", "Hörna", "Ekbacka IK"),
          ev("17'", "goal", "them", "Mål Ekbacka IK", "Ekbacka IK"),
          ev("21'", "yellow", "us", "Gult kort – Hugo (5)", "Ditt lag"),
          ev("25'", "period", "us", "Halvtid 1–1", "Match"),
          ev("26'", "period", "us", "Andra halvlek startar", "Match"),
          ev("26'", "sub", "us", "Byte: Liam (7) ut, Freja (14) in", "Ditt lag"),
          ev("28'", "shot", "them", "Skott på mål, räddning", "Ekbacka IK"),
          ev("31'", "goal", "us", "Mål! Elias (9), assist Freja (14)", "Ditt lag"),
          ev("32'", "corner", "us", "Hörna", "Ditt lag"),
        ],
      };
    }

    // Links name their live server in the fragment (#p=project&k=apiKey), which is never sent
    // to this web server. Older links without it use Matchreferat's own project.
    async function firebaseConfig() {
      const hash = new URLSearchParams(location.hash.slice(1));
      if (hash.get("p") && hash.get("k")) return { projectId: hash.get("p"), apiKey: hash.get("k") };
      try {
        const response = await fetch("/__/firebase/init.json");
        if (response.ok) return await response.json();
      } catch {}
      if (isLocal) return { projectId: "demo-matchreferat", apiKey: "demo" };
      throw new Error("no config");
    }

    async function connect() {
      if (params.has("demo")) {
        render(demoMatch());
        return;
      }
      if (!matchId) {
        showMessage("Länken saknar match. Be den som refererar om en ny länk.");
        return;
      }
      try {
        const [{ initializeApp }, fs] = await Promise.all([
          import(`${FIREBASE}/firebase-app.js`),
          import(`${FIREBASE}/firebase-firestore.js`),
        ]);
        const config = await firebaseConfig();
        const db = fs.getFirestore(initializeApp(config));
        fs.onSnapshot(
          fs.doc(db, "matches", matchId),
          (snap) => (snap.exists() ? render(snap.data()) : showMessage("Matchen finns inte längre. Den som refererar kan ha stängt av live-delningen.")),
          () => showMessage("Kunde inte hämta matchen. Kontrollera länken eller försök igen senare."),
        );
      } catch {
        showMessage("Kunde inte ansluta. Kontrollera nätet och ladda om sidan.");
      }
    }

    connect();
  </script>
</body>
</html>
