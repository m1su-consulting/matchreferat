    <clipPath id="ball"><circle cx="378" cy="392" r="38"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#1F8A49"/>
  <circle cx="256" cy="256" r="300" fill="#24A055" opacity="0.35"/>
  <!-- pitch line and ground shadow -->
  <path d="M40 452 H472" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="236" cy="448" rx="70" ry="9" fill="#0F5A2E" opacity="0.45"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- back arm and front arm -->
    <path d="M246 186 L212 230 L184 250" stroke-width="24"/>
    <path d="M286 188 L330 210 L356 186" stroke-width="24"/>
    <!-- planted leg -->
    <path d="M230 282 L216 358 L206 430 L238 436" stroke-width="30"/>
    <!-- kicking leg -->
    <path d="M254 286 L300 334 L340 368" stroke-width="30"/>
  </g>
  <!-- jersey -->
