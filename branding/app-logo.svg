  <circle cx="270" cy="126" r="36" fill="#FFFFFF"/>
  <circle cx="240" cy="113" r="9" fill="#F4C542"/>
  <!-- ball -->
  <circle cx="378" cy="392" r="38" fill="#FFFFFF"/>
  <g clip-path="url(#ball)" fill="#16341F">
    <path d="M378 374 L395 386 L389 406 L367 406 L361 386 Z"/>
    <path d="M378 354 L388 362 L378 370 L368 362 Z"/>
    <path d="M412 380 L420 396 L404 392 Z"/>
    <path d="M344 380 L352 392 L336 396 Z"/>
    <path d="M398 420 L404 432 L388 428 Z"/>
    <path d="M358 420 L368 428 L352 432 Z"/>
  </g>
  <circle cx="378" cy="392" r="38" fill="none" stroke="#16341F" stroke-width="3"/>
  <!-- speed lines behind the ball -->
  <path d="M330 404 L312 410 M334 424 L318 432" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="7" stroke-linecap="round"/>
</svg>
