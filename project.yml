name: Matchreferat
options:
  bundleIdPrefix: se.matchreferat
  deploymentTarget:
    iOS: "17.0"
targets:
  Matchreferat:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: se.matchreferat.app
            CFBundleURLSchemes: [matchreferat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.matchreferat.app
        PRODUCT_NAME: Matchreferat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_CFBundleDisplayName: Matchreferat
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VNDXQRN7C3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
