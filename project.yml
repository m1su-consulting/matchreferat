name: Matchreferat
options:
  bundleIdPrefix: se.matchreferat
  developmentLanguage: sv
  deploymentTarget:
    iOS: "26.0"
targets:
  Matchreferat:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: MatchreferatShare
    entitlements:
      path: Sources/Matchreferat.entitlements
      properties:
        com.apple.security.application-groups: [group.se.matchreferat.app]
        com.apple.developer.associated-domains: [applinks:matchreferat.web.app]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleLocalizations: [sv]
        CFBundleURLTypes:
          - CFBundleURLName: se.matchreferat.app
            CFBundleURLSchemes: [matchreferat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.matchreferat.app
        PRODUCT_NAME: Matchreferat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_CFBundleDisplayName: Matchreferat
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VNDXQRN7C3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MatchreferatShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    entitlements:
      path: ShareExtension/MatchreferatShare.entitlements
      properties:
        com.apple.security.application-groups: [group.se.matchreferat.app]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Matchreferat
        CFBundleLocalizations: [sv]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: ReadLineup
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.matchreferat.app.share
        PRODUCT_NAME: MatchreferatShare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VNDXQRN7C3
  MatchreferatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnitTests]
    dependencies:
      - target: Matchreferat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: se.matchreferat.app.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Matchreferat.app/Matchreferat"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VNDXQRN7C3
schemes:
  Matchreferat:
    build:
      targets:
        Matchreferat: all
        MatchreferatTests: [test]
    test:
      targets: [MatchreferatTests]
