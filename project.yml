name: Matchreferat
options:
  bundleIdPrefix: se.matchreferat
  deploymentTarget:
    iOS: "26.0"
targets:
  Matchreferat:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: se.matchreferat.app
            CFBundleURLSchemes: [matchreferat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.matchreferat.app
        PRODUCT_NAME: Matchreferat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_CFBundleDisplayName: Matchreferat
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VNDXQRN7C3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MatchreferatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnitTests]
    dependencies:
      - target: Matchreferat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: se.matchreferat.app.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Matchreferat.app/Matchreferat"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VNDXQRN7C3
schemes:
  Matchreferat:
    build:
      targets:
        Matchreferat: all
        MatchreferatTests: [test]
    test:
      targets: [MatchreferatTests]
